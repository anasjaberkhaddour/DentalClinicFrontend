<div class="max-w-4xl mx-auto space-y-6">

    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold text-slate-800">إضافة مستخدم جديد</h1>
        <p class="text-slate-500 text-sm mt-1">تسجيل مستخدم جديد في النظام</p>
      </div>
      <button pButton type="button" label="إلغاء" icon="pi pi-times" severity="secondary" [outlined]="true" (click)="cancel()"></button>
    </div>
  
    <!-- Login info -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
      <h2 class="font-bold text-slate-700 text-lg mb-4 flex items-center gap-2 border-b border-slate-100 pb-3">
        <i class="pi pi-key text-primary-600"></i>
        بيانات الدخول
      </h2>
  
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">اسم المستخدم <span class="text-red-500">*</span></label>
          <input pInputText [(ngModel)]="form.userName" class="w-full" dir="ltr" />
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">كلمة المرور <span class="text-red-500">*</span></label>
          <p-password [(ngModel)]="form.password" [feedback]="false" [toggleMask]="true" styleClass="w-full" inputStyleClass="w-full" />
        </div>
        <div class="flex items-center gap-3 pt-7">
          <p-toggleswitch [(ngModel)]="form.isActive" />
          <label class="text-sm font-semibold text-slate-700">حساب نشط</label>
        </div>
      </div>
    </div>
  
    <!-- Personal info -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
      <h2 class="font-bold text-slate-700 text-lg mb-4 flex items-center gap-2 border-b border-slate-100 pb-3">
        <i class="pi pi-user text-primary-600"></i>
        البيانات الشخصية
      </h2>
  
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">الاسم الأول <span class="text-red-500">*</span></label>
          <input pInputText [(ngModel)]="form.firstName" class="w-full" />
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">اسم الأب</label>
          <input pInputText [(ngModel)]="form.fatherName" class="w-full" />
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">اسم الأم</label>
          <input pInputText [(ngModel)]="form.motherName" class="w-full" />
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">الكنية <span class="text-red-500">*</span></label>
          <input pInputText [(ngModel)]="form.lastName" class="w-full" />
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">الرقم الوطني</label>
          <input pInputText [(ngModel)]="form.nationalId" class="w-full" />
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">تاريخ الميلاد</label>
          <p-datepicker [(ngModel)]="form.dateOfBirth" dateFormat="dd/mm/yy" [showIcon]="true" styleClass="w-full" appendTo="body" />
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">الجنس</label>
          <p-select [(ngModel)]="form.gender" [options]="GenderOptions" optionLabel="label" optionValue="value" placeholder="اختر" styleClass="w-full" />
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">الهاتف</label>
          <input pInputText [(ngModel)]="form.phone" class="w-full" dir="ltr" />
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">البريد الإلكتروني</label>
          <input pInputText [(ngModel)]="form.email" class="w-full" dir="ltr" />
        </div>
      </div>
    </div>
  
    <!-- Address -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
      <h2 class="font-bold text-slate-700 text-lg mb-4 flex items-center gap-2 border-b border-slate-100 pb-3">
        <i class="pi pi-map-marker text-primary-600"></i>
        العنوان
      </h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="md:col-span-3">
          <label class="block text-sm font-semibold text-slate-700 mb-2">العنوان</label>
          <input pInputText [(ngModel)]="form.address" class="w-full" />
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">المدينة</label>
          <input pInputText [(ngModel)]="form.city" class="w-full" />
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">البلد</label>
          <input pInputText [(ngModel)]="form.country" class="w-full" />
        </div>
      </div>
    </div>
  
    <!-- Roles + Notes -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
      <h2 class="font-bold text-slate-700 text-lg mb-4 flex items-center gap-2 border-b border-slate-100 pb-3">
        <i class="pi pi-shield text-primary-600"></i>
        الأدوار والملاحظات
      </h2>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">الأدوار</label>
          <p-multiselect
            [(ngModel)]="form.roles"
            [options]="roles()"
            optionLabel="label"
            optionValue="value"
            placeholder="اختر الأدوار"
            [filter]="true"
            display="chip"
            styleClass="w-full" />
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">ملاحظات</label>
          <textarea pTextarea [(ngModel)]="form.notes" rows="3" class="w-full"></textarea>
        </div>
      </div>
    </div>
  
    <!-- Actions -->
    <div class="sticky bottom-4 bg-white rounded-2xl shadow-lg border border-slate-200 p-4 flex items-center justify-end gap-2">
      <button pButton type="button" label="إلغاء" severity="secondary" [outlined]="true" (click)="cancel()"></button>
      <button pButton type="button" label="حفظ المستخدم" icon="pi pi-check" [loading]="saving()" (click)="save()"></button>
    </div>
  </div>
