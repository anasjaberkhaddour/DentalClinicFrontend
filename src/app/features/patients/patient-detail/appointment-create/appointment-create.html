<div class="max-w-3xl mx-auto space-y-6">

    <!-- Header -->
    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold text-slate-800">حجز موعد</h1>
        <p class="text-slate-500 text-sm mt-1">حجز موعد جديد للمريض</p>
      </div>
      <button pButton type="button" label="إلغاء" icon="pi pi-times" severity="secondary" [outlined]="true" (click)="cancel()"></button>
    </div>
  
    <!-- Form -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-5">
  
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">العيادة <span class="text-red-500">*</span></label>
          <p-select [(ngModel)]="form.clinicId" [options]="clinics()" optionLabel="label" optionValue="value" placeholder="اختر العيادة" styleClass="w-full" />
        </div>
  
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">المدة (دقيقة)</label>
          <p-inputnumber [(ngModel)]="form.durationMinutes" [min]="5" [max]="480" [step]="5" styleClass="w-full" inputStyleClass="w-full" suffix=" دقيقة" />
        </div>
  
        <div class="md:col-span-2 grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">التاريخ *</label>
            <p-datepicker
              [(ngModel)]="form.date"
              dateFormat="dd/mm/yy"
              [minDate]="today"
              [showIcon]="true"
              styleClass="w-full"
              appendTo="body" />
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">الوقت *</label>
            <p-datepicker
              [(ngModel)]="form.time"
              [timeOnly]="true"
              hourFormat="24"
              [showIcon]="true"
              styleClass="w-full"
              appendTo="body" />
          </div>
        </div>
  
        <div class="md:col-span-2">
          <label class="block text-sm font-semibold text-slate-700 mb-2">سبب الزيارة</label>
          <input pInputText [(ngModel)]="form.reason" class="w-full" placeholder="مثال: فحص دوري، ألم، متابعة..." />
        </div>
  
        <div class="md:col-span-2">
          <label class="block text-sm font-semibold text-slate-700 mb-2">ملاحظات</label>
          <textarea pTextarea [(ngModel)]="form.notes" rows="3" class="w-full" placeholder="ملاحظات إضافية"></textarea>
        </div>
      </div>
    </div>
  
    <!-- Actions -->
    <div class="sticky bottom-4 bg-white rounded-2xl shadow-lg border border-slate-200 p-4 flex items-center justify-end gap-2">
      <button pButton type="button" label="إلغاء" severity="secondary" [outlined]="true" (click)="cancel()"></button>
      <button pButton type="button" label="حجز الموعد" icon="pi pi-check" [loading]="saving()" (click)="save()"></button>
    </div>
  
  </div>
