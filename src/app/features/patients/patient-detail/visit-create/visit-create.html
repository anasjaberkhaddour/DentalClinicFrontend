<div class="max-w-5xl mx-auto space-y-6">

  <!-- Header -->
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold text-slate-800">جلسة جديدة</h1>
      <p class="text-slate-500 text-sm mt-1">تسجيل جلسة علاجية للمريض</p>
    </div>
    <button
      pButton
      type="button"
      label="إلغاء"
      icon="pi pi-times"
      severity="secondary"
      [outlined]="true"
      (click)="cancel()">
    </button>
  </div>

  <!-- Basic info -->
  <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-5">
    <h2 class="font-bold text-slate-700 text-lg flex items-center gap-2 border-b border-slate-100 pb-3">
      <i class="pi pi-info-circle text-primary-600"></i>
      المعلومات الأساسية
    </h2>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">العيادة <span class="text-red-500">*</span></label>
        <p-select
          [(ngModel)]="form.clinicId"
          [options]="clinics()"
          optionLabel="label"
          optionValue="value"
          placeholder="اختر العيادة"
          styleClass="w-full" />
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">تاريخ الجلسة</label>
        <p-datepicker
          [(ngModel)]="form.visitDate"
          [showTime]="true"
          dateFormat="dd/mm/yy"
          styleClass="w-full"
          appendTo="body" />
      </div>
    </div>
  </div>

  <!-- Clinical info -->
  <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-5">
    <h2 class="font-bold text-slate-700 text-lg flex items-center gap-2 border-b border-slate-100 pb-3">
      <i class="pi pi-clipboard text-primary-600"></i>
      المعلومات السريرية
    </h2>

    <div class="space-y-4">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">الفحص السريري</label>
        <textarea
          pTextarea
          [(ngModel)]="form.clinicalExamination"
          rows="2"
          class="w-full"
          placeholder="نتائج الفحص السريري لهذه الجلسة">
        </textarea>
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">الإجراءات المُنفَّذة</label>
        <textarea
          pTextarea
          [(ngModel)]="form.proceduresPerformed"
          rows="2"
          class="w-full"
          placeholder="الإجراءات التي تم تنفيذها في هذه الجلسة">
        </textarea>
      </div>
    </div>
  </div>

  <!-- Prescription & notes -->
  <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-5">
    <h2 class="font-bold text-slate-700 text-lg flex items-center gap-2 border-b border-slate-100 pb-3">
      <i class="pi pi-file text-primary-600"></i>
      الوصفة والملاحظات
    </h2>

    <div class="space-y-4">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">الوصفة الطبية</label>
        <textarea
          pTextarea
          [(ngModel)]="form.prescription"
          rows="3"
          class="w-full"
          placeholder="الأدوية الموصوفة">
        </textarea>
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">ملاحظات</label>
        <textarea
          pTextarea
          [(ngModel)]="form.notes"
          rows="2"
          class="w-full"
          placeholder="ملاحظات إضافية">
        </textarea>
      </div>
    </div>
  </div>

  <!-- Actions -->
  <div class="sticky bottom-4 bg-white rounded-2xl shadow-lg border border-slate-200 p-4 flex items-center justify-end gap-2">
    <button pButton type="button" label="إلغاء" severity="secondary" [outlined]="true" (click)="cancel()"></button>
    <button pButton type="button" label="حفظ الجلسة" icon="pi pi-check" [loading]="saving()" (click)="save()"></button>
  </div>

</div>
