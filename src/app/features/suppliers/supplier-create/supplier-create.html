<div class="max-w-3xl mx-auto space-y-6">

    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold text-slate-800">إضافة مورد جديد</h1>
        <p class="text-slate-500 text-sm mt-1">تسجيل مورد جديد</p>
      </div>
      <button pButton type="button" label="إلغاء" icon="pi pi-times" severity="secondary" [outlined]="true" (click)="cancel()"></button>
    </div>
  
    <!-- Basic info -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-4">
      <h2 class="font-bold text-slate-700 text-lg flex items-center gap-2 border-b border-slate-100 pb-3">
        <i class="pi pi-info-circle text-primary-600"></i>
        المعلومات الأساسية
      </h2>
  
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">الرمز <span class="text-red-500">*</span></label>
          <input pInputText [(ngModel)]="form.code" class="w-full" placeholder="SUP-001" dir="ltr" />
        </div>
        <div class="flex items-center gap-3 pt-7">
          <p-toggleswitch [(ngModel)]="form.isActive" />
          <label class="text-sm font-semibold text-slate-700">نشط</label>
        </div>
        <div class="md:col-span-2">
          <label class="block text-sm font-semibold text-slate-700 mb-2">اسم المورد <span class="text-red-500">*</span></label>
          <input pInputText [(ngModel)]="form.nameAr" class="w-full" />
        </div>
      </div>
    </div>
  
    <!-- Address -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-4">
      <h2 class="font-bold text-slate-700 text-lg flex items-center gap-2 border-b border-slate-100 pb-3">
        <i class="pi pi-map-marker text-primary-600"></i>
        العنوان
      </h2>
  
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="md:col-span-2">
          <label class="block text-sm font-semibold text-slate-700 mb-2">العنوان</label>
          <input pInputText [(ngModel)]="form.address" class="w-full" />
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">المدينة</label>
          <input pInputText [(ngModel)]="form.city" class="w-full" />
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">البلد</label>
          <input pInputText [(ngModel)]="form.country" class="w-full" />
        </div>
      </div>
    </div>
  
    <!-- Contacts -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-4">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <h2 class="font-bold text-slate-700 text-lg flex items-center gap-2">
          <i class="pi pi-phone text-primary-600"></i>
          جهات الاتصال
        </h2>
        <button pButton type="button" label="إضافة" icon="pi pi-plus" size="small" (click)="addContact()"></button>
      </div>
  
      @if (form.contacts.length === 0) {
        <div class="text-center py-6 bg-slate-50 rounded-xl border border-slate-200">
          <i class="pi pi-phone text-slate-300 text-2xl mb-2 block"></i>
          <p class="text-sm text-slate-400">لم تتم إضافة جهات اتصال بعد</p>
        </div>
      } @else {
        <div class="space-y-3">
          @for (contact of form.contacts; track $index; let i = $index) {
            <div class="grid grid-cols-12 gap-2 items-end p-3 rounded-xl bg-slate-50 border border-slate-100">
              <div class="col-span-12 md:col-span-3">
                <label class="block text-xs text-slate-500 mb-1">النوع</label>
                <p-select [(ngModel)]="contact.type" [options]="ContactTypeOptions" optionLabel="label" optionValue="value" styleClass="w-full" />
              </div>
              <div class="col-span-12 md:col-span-4">
                <label class="block text-xs text-slate-500 mb-1">القيمة</label>
                <input pInputText [(ngModel)]="contact.value" class="w-full" dir="ltr" placeholder="09xxxxxxxx" />
              </div>
              <div class="col-span-12 md:col-span-3">
                <label class="block text-xs text-slate-500 mb-1">التسمية</label>
                <input pInputText [(ngModel)]="contact.label" class="w-full" />
              </div>
              <div class="col-span-12 md:col-span-2 flex justify-end gap-1">
                <button
                  pButton
                  type="button"
                  icon="pi pi-star"
                  [severity]="contact.isPrimary ? 'warn' : 'secondary'"
                  [text]="!contact.isPrimary"
                  [rounded]="true"
                  size="small"
                  (click)="setPrimary(i)">
                </button>
                <button pButton type="button" icon="pi pi-trash" severity="danger" [text]="true" [rounded]="true" size="small" (click)="removeContact(i)"></button>
              </div>
            </div>
          }
        </div>
      }
    </div>
  
    <!-- Contact person + Tax + Notes -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-4">
      <h2 class="font-bold text-slate-700 text-lg flex items-center gap-2 border-b border-slate-100 pb-3">
        <i class="pi pi-user text-primary-600"></i>
        معلومات إضافية
      </h2>
  
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">الشخص المسؤول</label>
          <input pInputText [(ngModel)]="form.contactPerson" class="w-full" />
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">الرقم الضريبي</label>
          <input pInputText [(ngModel)]="form.taxNumber" class="w-full" dir="ltr" />
        </div>
        <div class="md:col-span-2">
          <label class="block text-sm font-semibold text-slate-700 mb-2">ملاحظات</label>
          <textarea pTextarea [(ngModel)]="form.notes" rows="2" class="w-full"></textarea>
        </div>
      </div>
    </div>
  
    <div class="sticky bottom-4 bg-white rounded-2xl shadow-lg border border-slate-200 p-4 flex items-center justify-end gap-2">
      <button pButton type="button" label="إلغاء" severity="secondary" [outlined]="true" (click)="cancel()"></button>
      <button pButton type="button" label="حفظ" icon="pi pi-check" [loading]="saving()" (click)="save()"></button>
    </div>
  </div>
