<div class="max-w-3xl mx-auto space-y-6">

    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold text-slate-800">إضافة دور جديد</h1>
        <p class="text-slate-500 text-sm mt-1">إنشاء دور وربطه بالصلاحيات</p>
      </div>
      <button pButton type="button" label="إلغاء" icon="pi pi-times" severity="secondary" [outlined]="true" (click)="cancel()"></button>
    </div>
  
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-5">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">اسم الدور <span class="text-red-500">*</span></label>
        <input pInputText [(ngModel)]="form.name" class="w-full" placeholder="مثال: Doctor, Receptionist..." />
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">الوصف</label>
        <textarea pTextarea [(ngModel)]="form.description" rows="2" class="w-full"></textarea>
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">الصلاحيات</label>
        <p-multiselect
          [(ngModel)]="form.permissionCodes"
          [options]="permissionOptions()"
          optionLabel="label"
          optionValue="value"
          placeholder="اختر الصلاحيات"
          [filter]="true"
          display="chip"
          styleClass="w-full"
          appendTo="body" />
      </div>
    </div>
  
    <div class="sticky bottom-4 bg-white rounded-2xl shadow-lg border border-slate-200 p-4 flex items-center justify-end gap-2">
      <button pButton type="button" label="إلغاء" severity="secondary" [outlined]="true" (click)="cancel()"></button>
      <button pButton type="button" label="حفظ الدور" icon="pi pi-check" [loading]="saving()" (click)="save()"></button>
    </div>
  </div>
