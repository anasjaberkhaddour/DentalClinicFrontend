<div class="space-y-6">
  <div>
    <h1 class="text-2xl font-bold text-slate-800">{{ pageTitle }}</h1>
    <p class="text-slate-500 text-sm mt-1">{{ pageSubtitle }}</p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
    @for (report of reports; track report.route) {
      <a [routerLink]="report.route"
         class="group bg-white rounded-2xl shadow-sm border border-slate-200 p-6 hover:shadow-xl hover:border-primary-300 transition-all">
        <div class="w-14 h-14 rounded-xl bg-primary-50 flex items-center justify-center mb-4">
          <i [class]="'pi ' + report.icon + ' text-primary-600 text-2xl'"></i>
        </div>
        <h3 class="font-bold text-slate-800 mb-1">{{ report.title }}</h3>
        <p class="text-sm text-slate-500 mb-4">{{ report.description }}</p>
        <div class="flex items-center gap-1 text-primary-600 font-semibold text-sm">
          فتح التقرير
          <i class="pi pi-arrow-left"></i>
        </div>
      </a>
    }
  </div>
</div>
