<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-primary-50 to-primary-100 p-4">
    <div class="w-full max-w-3xl">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-primary-600 shadow-lg mb-4">
          <i class="pi pi-building text-white text-2xl"></i>
        </div>
        <h1 class="text-2xl font-bold text-slate-800 mb-2">اختر العيادة</h1>
        <p class="text-slate-500">حدد العيادة التي تريد العمل فيها</p>
      </div>
  
      @if (loading()) {
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          @for (i of [1,2]; track i) {
            <div class="bg-white rounded-2xl shadow-sm p-6 space-y-3">
              <p-skeleton width="60%" height="1.5rem" />
              <p-skeleton width="80%" height="1rem" />
            </div>
          }
        </div>
      }
  
      @else if (clinics().length === 0) {
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-12 text-center">
          <i class="pi pi-building text-slate-300 text-4xl mb-3 block"></i>
          <h3 class="text-lg font-semibold text-slate-600 mb-1">لا توجد عيادات متاحة</h3>
          <p class="text-sm text-slate-400 mb-6">لم يتم ربط حسابك بأي عيادة</p>
          <button pButton type="button" label="تسجيل الخروج" icon="pi pi-sign-out" severity="secondary" (click)="logout()"></button>
        </div>
      }
  
      @else {
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          @for (clinic of clinics(); track clinic.id) {
            <button
              type="button"
              class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 text-right hover:shadow-xl hover:border-primary-300 transition-all"
              (click)="selectClinic(clinic)">
              <div class="flex items-center gap-3 mb-3">
                <div class="w-12 h-12 rounded-xl bg-primary-50 flex items-center justify-center">
                  <i class="pi pi-building text-primary-600"></i>
                </div>
                <div class="flex-1 min-w-0">
                  <h3 class="font-bold text-slate-800 truncate">{{ clinic.name }}</h3>
                  @if (clinic.code) {
                    <p class="text-sm text-slate-500 font-mono">{{ clinic.code }}</p>
                  }
                </div>
                <i class="pi pi-arrow-left text-slate-400"></i>
              </div>
              @if (clinic.city) {
                <div class="text-sm text-slate-600">
                  <i class="pi pi-map-marker text-slate-400 text-xs"></i>
                  {{ clinic.city }}
                </div>
              }
            </button>
          }
        </div>
  
        <div class="text-center mt-6">
          <button pButton type="button" label="تسجيل الخروج" icon="pi pi-sign-out" severity="secondary" [text]="true" (click)="logout()"></button>
        </div>
      }
    </div>
  </div>
