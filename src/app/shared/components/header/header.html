<header class="h-16 bg-white/80 backdrop-blur-md border-b border-slate-200 flex items-center justify-between px-6 sticky top-0 z-10">

  <!-- Left: greeting -->
  <div class="flex items-center gap-3">
    <h1 class="text-lg font-semibold text-slate-700">
      مرحباً، <span class="text-primary-600">{{ userName() }}</span>
    </h1>
    <div class="w-px h-6 bg-slate-200 mx-2"></div>
    <button
      type="button"
      class="flex items-center gap-2 px-3 py-1.5 rounded-lg hover:bg-slate-100 transition-colors text-sm"
      (click)="switchClinic()">
      <i class="pi pi-building text-primary-600"></i>
      <span class="font-semibold text-slate-700">{{ clinicContext.clinicName || 'اختر عيادة' }}</span>
      <i class="pi pi-angle-down text-slate-400 text-xs"></i>
    </button>
  </div>

  <!-- Right: actions -->
  <div class="flex items-center gap-2">
    <button
      pButton
      type="button"
      icon="pi pi-bell"
      class="p-button-text p-button-rounded !text-slate-500 hover:!bg-slate-100"
      pTooltip="الإشعارات"
      tooltipPosition="bottom">
    </button>

    <div class="w-px h-6 bg-slate-200 mx-1"></div>

    <button
      type="button"
      class="flex items-center gap-3 px-2 py-1.5 rounded-xl hover:bg-slate-100 transition-colors"
      (click)="menu.toggle($event)">
      @if (photoUrl()) {
        <img
          [src]="photoUrl()!"
          alt="avatar"
          class="w-9 h-9 rounded-full object-cover border border-slate-200" />
      } @else {
        <p-avatar
          [label]="userName().charAt(0).toUpperCase()"
          shape="circle"
          styleClass="!bg-primary-600 !text-white" />
      }
      <div class="hidden md:flex flex-col items-start leading-tight">
        <span class="text-sm font-semibold text-slate-700">{{ userName() }}</span>
        <span class="text-xs text-slate-400">{{ userRole() }}</span>
      </div>
      <i class="pi pi-angle-down text-slate-400 text-sm"></i>
    </button>

    <p-menu #menu [model]="userMenu" [popup]="true" appendTo="body" />
  </div>
</header>
