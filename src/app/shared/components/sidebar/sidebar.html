<aside
  class="bg-white border-l border-slate-200 flex flex-col transition-all duration-300 shadow-sm h-full overflow-hidden"
  [style.width]="collapsed() ? '4.5rem' : '16rem'">

  <!-- Logo -->
  <div class="h-16 flex items-center border-b border-slate-200 px-3 gap-2">
    <div class="flex items-center gap-2 flex-1 min-w-0">
      <div class="w-11 h-11 rounded-xl overflow-hidden flex items-center justify-center flex-shrink-0">
        <img src="assets/dark-background-sm.png" alt="Logo" class="w-full h-full object-contain" />
      </div>
      @if (!collapsed()) {
        <span class="font-bold text-slate-700 truncate">عيادة الأسنان</span>
      }
    </div>

    <button
      (click)="toggle()"
      class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 hover:bg-slate-100 hover:text-slate-700 transition-colors flex-shrink-0"
      [pTooltip]="collapsed() ? 'توسيع' : 'طي'"
      tooltipPosition="left">
      <i [class]="'pi ' + (collapsed() ? 'pi-angle-left' : 'pi-angle-right')"></i>
    </button>
  </div>

  <!-- Menu -->
  <nav class="flex-1 overflow-y-auto overflow-x-hidden py-3">

    @for (group of menuGroups; track group.label) {
      <div class="mb-1">

        <!-- Group header (when expanded) -->
        @if (!collapsed()) {
        <button
            type="button"
            (click)="toggleGroup(group.label)"
            class="w-full flex items-center justify-between px-3 py-2.5 mx-2 text-sm font-bold text-slate-700 hover:bg-slate-50 rounded-lg transition-colors">
            <span class="flex items-center gap-2">
              <i [class]="'pi ' + group.icon + ' text-primary-600'"></i>
              {{ group.label }}
            </span>
            <i [class]="'pi ' + (isGroupExpanded(group.label) ? 'pi-chevron-up' : 'pi-chevron-down')" class="text-[10px] text-slate-400"></i>
          </button>
        }

        <!-- Items -->
        @if (collapsed() || isGroupExpanded(group.label)) {
          @for (item of visibleItems(group); track item.route) {
            <a
              [routerLink]="item.route"
              routerLinkActive="bg-primary-50 text-primary-700 border-primary-500"
              class="flex items-center gap-3 mx-2 px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-100 hover:text-slate-900 border-r-4 border-transparent transition-all mb-0.5 text-sm"
              [pTooltip]="collapsed() ? item.label : ''"
              tooltipPosition="left">
              <i [class]="'pi ' + item.icon + ' text-base flex-shrink-0'"></i>
              @if (!collapsed()) {
                <span class="font-medium truncate">{{ item.label }}</span>
              }
            </a>
          }
        }
      </div>
    }

  </nav>

  <!-- Bottom collapse -->
  <button
    (click)="toggle()"
    class="h-12 border-t border-slate-200 flex items-center justify-center text-slate-400 hover:bg-slate-100 hover:text-slate-700 transition-colors"
    [pTooltip]="collapsed() ? 'توسيع' : 'طي'"
    tooltipPosition="left">
    <i [class]="'pi ' + (collapsed() ? 'pi-angle-left' : 'pi-angle-right')"></i>
  </button>
</aside>
